plugins {
    id 'com.android.application'
}

android {
    namespace 'app.heraclitus.daily'
    compileSdk 34

    defaultConfig {
        applicationId 'app.heraclitus.daily'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Personal app, not published anywhere: the key lives in the repo so every
    // build is signed the same way and updates install over the old version.
    signingConfigs {
        release {
            storeFile file('heraclitus.keystore')
            storeType 'pkcs12'
            storePassword 'heraclitus'
            keyAlias 'heraclitus'
            keyPassword 'heraclitus'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
